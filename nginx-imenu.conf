# ==============================================================================
# Nginx Reverse Proxy & SSL Configuration Template for iMenu Ecosystem
# Target: Ubuntu VPS with PM2 (Ports: 3001-API, 3003-Admin, 3005-Menu, 3000-Web)
# ==============================================================================

# 1. UPSTREAM DEFINITIONS
upstream imenu_api_upstream {
    server 127.0.0.1:3001;
    keepalive 64;
}

upstream imenu_admin_upstream {
    server 127.0.0.1:3003;
    keepalive 64;
}

upstream imenu_menu_upstream {
    server 127.0.0.1:3005;
    keepalive 64;
}

upstream imenu_web_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 2. API & WEBSOCKET GATEWAY (api.yourdomain.vn)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.yourdomain.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yourdomain.vn;

    # SSL Certificates (Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/api.yourdomain.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.vn/privkey.pem;

    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTTP API Endpoints
    location / {
        proxy_pass http://imenu_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Realtime Gateway (/socket.io/)
    location /socket.io/ {
        proxy_pass http://imenu_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ------------------------------------------------------------------------------
# 3. MERCHANT ADMIN & POS HUB (admin.yourdomain.vn)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name admin.yourdomain.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.yourdomain.vn;

    # ssl_certificate /etc/letsencrypt/live/admin.yourdomain.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.yourdomain.vn/privkey.pem;

    location / {
        proxy_pass http://imenu_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

