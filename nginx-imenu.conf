# ------------------------------------------------------------------------------
# 5. LANDING PAGE & ONBOARDING (yourdomain.vn)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name yourdomain.vn www.yourdomain.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.vn www.yourdomain.vn;

    # ssl_certificate /etc/letsencrypt/live/yourdomain.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.vn/privkey.pem;

    location / {
        proxy_pass http://imenu_web_upstream;
        proxy_http_version 1.1;
